# a summary about you
summary: "Welcome to my profile! I am currently an undergraduate in the [School of Mechanical Engineering](https://me.sjtu.edu.cn/en), [Shanghai Jiao Tong University](https://en.sjtu.edu.cn), majoring in Mechanical Engineering and minoring in Computer Science and Technology. My academic interests lie in the intersection of **mechanical engineering** and **intelligent algorithms**, with a particular focus on **robotics**. I am passionate about exploring the frontiers of robotics and artificial intelligence, and I am dedicated to contributing to the advancement of these fields through research, innovation, and practical applications."

